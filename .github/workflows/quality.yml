name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS simulator
        run: xcodebuild -project ios/Konsens.xcodeproj -scheme Konsens -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 16 Pro' CODE_SIGNING_ALLOWED=NO build
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard migrations
        run: |
          test -f supabase/migrations/20260810090000_konsens_foundation.sql
          ! grep -R "service_role\|sb_secret_" supabase cloudflare ios app
