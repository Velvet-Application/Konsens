name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Lint web
        shell: bash
        run: |
          set +e
          npm run lint > eslint.log 2>&1
          status=$?
          cat eslint.log
          if [ "$status" -ne 0 ]; then
            tail -80 eslint.log | while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              line=${line//$'\n'/'%0A'}
              echo "::error::$line"
            done
            exit "$status"
          fi
      - run: npm test
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS simulator
        shell: bash
        run: |
          set +e
          xcodebuild -project ios/Konsens.xcodeproj -scheme Konsens -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build > xcodebuild.log 2>&1
          status=$?
          cat xcodebuild.log
          if [ "$status" -ne 0 ]; then
            tail -100 xcodebuild.log | while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              line=${line//$'\n'/'%0A'}
              echo "::error::$line"
            done
            exit "$status"
          fi
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard migrations and secrets
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/migrations/20260810090000_konsens_foundation.sql
          test -f supabase/migrations/20260810173000_finance_learning_wealth_v1.sql
          if grep -R -n -E "sb_secret_[A-Za-z0-9_-]+|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=[[:space:]]*['\"]?[A-Za-z0-9]" supabase cloudflare ios app; then
            echo "::error::A runtime Supabase secret appears to be committed."
            exit 1
          fi
