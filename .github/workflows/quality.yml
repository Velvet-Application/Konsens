name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Lint web
        shell: bash
        run: |
          set +e
          npm run lint > eslint.log 2>&1
          status=$?
          cat eslint.log
          if [ "$status" -ne 0 ]; then
            tail -80 eslint.log | while IFS= read -r line; do
              line=${line//'%'/'%25'}; line=${line//$'\r'/'%0D'}; line=${line//$'\n'/'%0A'}; echo "::error::$line"
            done
            exit "$status"
          fi
      - run: npm test
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS app and widget
        shell: bash
        run: |
          set +e
          : > xcodebuild.log
          xcodebuild -project ios/Konsens.xcodeproj -scheme Konsens -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build >> xcodebuild.log 2>&1
          app_status=$?
          cat xcodebuild.log
          if [ "$app_status" -ne 0 ]; then
            echo "---- actionable Xcode errors ----"
            grep -n -E "(^|[[:space:]])error:|fatal error:|Command SwiftCompile failed|BUILD FAILED|The following build commands failed" xcodebuild.log | tail -180 | while IFS= read -r line; do
              line=${line//'%'/'%25'}; line=${line//$'\r'/'%0D'}; line=${line//$'\n'/'%0A'}; echo "::error::$line"
            done
            exit 1
          fi
      - name: Typecheck Apple Watch companion source
        shell: bash
        run: |
          set -euo pipefail
          WATCH_SDK="$(xcrun --sdk watchsimulator --show-sdk-path)"
          xcrun --sdk watchsimulator swiftc -typecheck -sdk "$WATCH_SDK" -target arm64-apple-watchos10.0-simulator ios/KonsensWatch/KonsensWatchApp.swift
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard migrations and secrets
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/migrations/20260810090000_konsens_foundation.sql
          test -f supabase/migrations/20260810173000_finance_learning_wealth_v1.sql
          test -f supabase/migrations/20260811082806_v2_notifications_whales_monetization.sql
          test -f supabase/migrations/20260811083239_v2_real_public_wallet_registry.sql
          test -f supabase/migrations/20260811083331_v2_finance_asset_profiles.sql
          if grep -R -n -E "sb_secret_[A-Za-z0-9_-]+|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=[[:space:]]*['\"]?[A-Za-z0-9]" supabase cloudflare ios app; then
            echo "::error::A runtime Supabase secret appears to be committed."
            exit 1
          fi
