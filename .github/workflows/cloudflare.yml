name: Deploy Cloudflare API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["cloudflare/**"]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Validate Worker
        run: npx wrangler deploy --config cloudflare/wrangler.jsonc --env production --dry-run
      - name: Deploy Worker
        run: npx wrangler deploy --config cloudflare/wrangler.jsonc --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
